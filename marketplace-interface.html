
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wood to You — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080808; --bg-2: #111111; --bg-3: #181818;
  --border: rgba(255,255,255,0.07); --border-hi: rgba(255,255,255,0.13);
  --amber: #e8750a; --amber-dim: rgba(232,117,10,0.12); --amber-glow: rgba(232,117,10,0.25);
  --text-1: #f0ede8; --text-2: #8a8480; --text-3: #4a4744;
  --green: #3ecf8e; --green-dim: rgba(62,207,142,0.1);
  --font: 'Plus Jakarta Sans', sans-serif; --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
}
html { font-family: var(--font); background: var(--bg); color: var(--text-1); }
body { min-height: 100dvh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.022; pointer-events: none; z-index: 100; }
nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50; background: rgba(12,12,12,0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-hi); border-radius: 999px; padding: 10px 20px 10px 14px; display: flex; align-items: center; gap: 24px; box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.5); animation: nav-drop 0.8s var(--ease-out) both; }
@keyframes nav-drop { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
.nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; letter-spacing: -0.02em; }
.nav-logo-dot { width: 28px; height: 28px; border-radius: 10px; background: var(--amber); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.nav-links { display: flex; gap: 4px; }
.nav-link { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all 0.3s var(--ease-out); text-decoration: none; }
.nav-link:hover { color: var(--text-1); background: rgba(255,255,255,0.06); }
.nav-link.active { color: var(--amber); background: var(--amber-dim); }
.nav-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); font-weight: 500; }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
.app { max-width: 1400px; margin: 0 auto; padding: 96px 24px 40px; display: grid; grid-template-rows: auto 1fr; gap: 24px; min-height: 100dvh; }
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; animation: fade-up 0.7s 0.1s var(--ease-out) both; }
.stat-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; transition: border-color 0.3s var(--ease-out); }
.stat-card:hover { border-color: var(--border-hi); }
.stat-label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
.stat-value { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: var(--text-1); }
.stat-sub { font-size: 12px; color: var(--text-2); }
.stat-value.amber { color: var(--amber); } .stat-value.green { color: var(--green); }
.main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; animation: fade-up 0.7s 0.2s var(--ease-out) both; }
.panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.panel-count { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--bg-3); color: var(--text-2); }
.panel-body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.panel-body::-webkit-scrollbar { width: 4px; } .panel-body::-webkit-scrollbar-track { background: transparent; } .panel-body::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
.job-card { background: var(--bg-3); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; transition: all 0.35s var(--ease-out); position: relative; overflow: hidden; }
.job-card::before { content: ''; position: absolute; inset: 0; border-radius: 14px; background: radial-gradient(ellipse at top left, var(--amber-glow), transparent 60%); opacity: 0; transition: opacity 0.35s var(--ease-out); }
.job-card:hover { border-color: var(--border-hi); transform: translateY(-1px); } .job-card:hover::before { opacity: 0.4; }
.job-card.selected { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), inset 0 1px 0 rgba(255,255,255,0.06); } .job-card.selected::before { opacity: 1; } .job-card:active { transform: scale(0.99); }
.job-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.job-retailer { font-size: 13px; font-weight: 700; color: var(--text-1); }
.job-time-badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
.badge-asap { background: rgba(239,68,68,0.15); color: #f87171; } .badge-2hr { background: var(--amber-dim); color: var(--amber); } .badge-same { background: var(--green-dim); color: var(--green); }
.job-materials { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.material-tag { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-2); }
.job-route { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-2); margin-bottom: 12px; }
.route-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; } .route-dot.green { background: var(--green); } .route-dot.amber { background: var(--amber); }
.route-line { width: 24px; height: 1px; background: var(--border-hi); flex-shrink: 0; }
.route-addr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-footer { display: flex; align-items: center; justify-content: space-between; }
.job-weight { font-size: 11px; color: var(--text-3); } .job-payout { font-size: 15px; font-weight: 800; color: var(--amber); letter-spacing: -0.02em; }
.job-dispatch-btn { font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: none; cursor: pointer; background: var(--amber); color: #000; transition: all 0.3s var(--ease-out); display: none; }
.job-card.selected .job-dispatch-btn { display: block; } .job-dispatch-btn:hover { transform: scale(1.04); box-shadow: 0 4px 16px var(--amber-glow); } .job-dispatch-btn:active { transform: scale(0.97); }
.driver-card { background: var(--bg-3); border: 1px solid var(--border); border-radius: 14px; padding: 14px; cursor: pointer; transition: all 0.35s var(--ease-out); }
.driver-card:hover { border-color: var(--border-hi); transform: translateY(-1px); }
.driver-card.compatible { border-color: rgba(62,207,142,0.4); box-shadow: 0 0 0 1px rgba(62,207,142,0.15); } .driver-card.incompatible { opacity: 0.35; } .driver-card:active { transform: scale(0.99); }
.driver-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.driver-avatar { width: 36px; height: 36px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--border-hi); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-1); flex-shrink: 0; }
.driver-info { flex: 1; min-width: 0; } .driver-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; } .driver-vehicle { font-size: 11px; color: var(--text-2); }
.driver-status { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 999px; flex-shrink: 0; }
.status-available { background: var(--green-dim); color: var(--green); } .status-busy { background: rgba(255,255,255,0.05); color: var(--text-3); }
.driver-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.driver-spec { font-size: 11px; color: var(--text-2); } .driver-spec span { color: var(--text-1); font-weight: 600; }
.driver-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.driver-tag { font-size: 10px; font-weight: 500; padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-3); }
.driver-tag.match { background: var(--green-dim); border-color: rgba(62,207,142,0.2); color: var(--green); }
.driver-footer { display: flex; align-items: center; justify-content: space-between; }
.driver-rating { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; } .driver-rating .star { color: var(--amber); }
.driver-dist { font-size: 11px; color: var(--text-3); }
.driver-select-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--green); cursor: pointer; background: transparent; color: var(--green); transition: all 0.3s var(--ease-out); display: none; }
.driver-card.compatible .driver-select-btn { display: block; } .driver-select-btn:hover { background: var(--green-dim); transform: scale(1.04); }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(12,12,12,0.95); backdrop-filter: blur(20px); border: 1px solid var(--green); border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 0 0 1px rgba(62,207,142,0.1), 0 16px 48px rgba(0,0,0,0.6); transition: transform 0.5s var(--ease-out), opacity 0.5s var(--ease-out); opacity: 0; z-index: 200; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast-icon { font-size: 20px; } .toast-text { font-size: 13px; font-weight: 600; color: var(--text-1); } .toast-sub { font-size: 11px; color: var(--text-2); margin-top: 2px; }
@keyframes fade-up { from { opacity: 0; transform: translateY(20px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
.job-card, .driver-card { animation: fade-up 0.5s var(--ease-out) both; }
@media (max-width: 768px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } .main-grid { grid-template-columns: 1fr; } nav { padding: 8px 14px; gap: 12px; } .nav-links { display: none; } }
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><div class="nav-logo-dot">🪵</div>Wood to You</div>
  <div class="nav-links">
    <a class="nav-link active">Dispatch</a><a class="nav-link">Retailers</a><a class="nav-link">Drivers</a><a class="nav-link">Analytics</a>
  </div>
  <div class="nav-status"><div class="pulse"></div>Live</div>
</nav>
<div class="app">
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Open Jobs</div><div class="stat-value amber" id="stat-jobs">6</div><div class="stat-sub">Awaiting dispatch</div></div>
    <div class="stat-card"><div class="stat-label">Available Drivers</div><div class="stat-value green" id="stat-drivers">4</div><div class="stat-sub">In your area</div></div>
    <div class="stat-card"><div class="stat-label">Delivered Today</div><div class="stat-value">12</div><div class="stat-sub">Up 3 from yesterday</div></div>
    <div class="stat-card"><div class="stat-label">Avg Match Time</div><div class="stat-value">4<span style="font-size:16px;font-weight:500;color:var(--text-2)">m</span></div><div class="stat-sub">Retailer to driver</div></div>
  </div>
  <div class="main-grid">
    <div class="panel"><div class="panel-header"><span class="panel-title">🏪 Retailer Job Posts</span><span class="panel-count" id="jobs-count">6 open</span></div><div class="panel-body" id="jobs-list"></div></div>
    <div class="panel"><div class="panel-header"><span class="panel-title">🚚 Qualified Drivers</span><span class="panel-count" id="drivers-count">7 drivers</span></div><div class="panel-body" id="drivers-list"></div></div>
  </div>
</div>
<div class="toast" id="toast"><div class="toast-icon">✅</div><div><div class="toast-text" id="toast-text">Driver dispatched!</div><div class="toast-sub" id="toast-sub">ETA: ~18 min</div></div></div>
<script>
const JOBS=[{id:'j1',retailer:'Home Depot — Encinitas',urgency:'asap',materials:[{icon:'🪵',name:'Lumber (2x4, 8ft)'},{icon:'🔩',name:'Fasteners'}],from:'1021 N. Vulcan Ave, Encinitas',to:'340 Saxony Rd, Encinitas',weight:'820 lbs',payout:'$68',required:['flatbed','lumber'],minCapacity:800},{id:'j2',retailer:'84 Lumber — Carlsbad',urgency:'2hr',materials:[{icon:'🧱',name:'Drywall (4x8)'},{icon:'🧱',name:'Joint Compound'}],from:'2550 El Camino Real, Carlsbad',to:'5891 Palmer Way, Carlsbad',weight:'1,100 lbs',payout:'$95',required:['flatbed','drywall'],minCapacity:1000},{id:'j3',retailer:'Ace Hardware — Oceanside',urgency:'same',materials:[{icon:'🔧',name:'PVC Pipe (3/4in)'},{icon:'💧',name:'Fittings'}],from:'3655 Mission Ave, Oceanside',to:'2141 Foussat Rd, Oceanside',weight:'220 lbs',payout:'$38',required:['van','plumbing'],minCapacity:300},{id:'j4',retailer:'Home Depot — Vista',urgency:'2hr',materials:[{icon:'🏠',name:'Roofing Shingles'},{icon:'🔩',name:'Ridge Caps'}],from:'1550 University Dr, Vista',to:'1420 N. Santa Fe Ave, Vista',weight:'1,400 lbs',payout:'$120',required:['flatbed','roofing'],minCapacity:1200},{id:'j5',retailer:'Builders FirstSource',urgency:'asap',materials:[{icon:'🪟',name:'Windows (36x48)'},{icon:'🪟',name:'Door Frame'}],from:'2310 S. Santa Fe Ave, Vista',to:'945 Crest Dr, Encinitas',weight:'480 lbs',payout:'$72',required:['van','fragile'],minCapacity:500},{id:'j6',retailer:'Pacific Coast Supply',urgency:'same',materials:[{icon:'🪜',name:'Steel Studs'},{icon:'🔩',name:'Track Channel'}],from:'4885 Viewridge Ave, SD',to:'7620 Balboa Ave, SD',weight:'660 lbs',payout:'$55',required:['flatbed','lumber'],minCapacity:700}];
const DRIVERS=[{id:'d1',name:'Marcus T.',initials:'MT',vehicle:'1-Ton Flatbed',capacity:2000,tags:['lumber','roofing','flatbed','drywall'],rating:4.9,reviews:312,dist:'1.2 mi',status:'available'},{id:'d2',name:'Diego R.',initials:'DR',vehicle:'Cargo Van (3/4 Ton)',capacity:1500,tags:['plumbing','fragile','van','hardware'],rating:4.8,reviews:187,dist:'0.8 mi',status:'available'},{id:'d3',name:'Tyler K.',initials:'TK',vehicle:'Pickup + Trailer',capacity:2500,tags:['lumber','roofing','flatbed','heavy'],rating:4.7,reviews:94,dist:'2.4 mi',status:'available'},{id:'d4',name:'James W.',initials:'JW',vehicle:'Box Truck (16ft)',capacity:3500,tags:['drywall','fragile','lumber','van','heavy'],rating:4.9,reviews:528,dist:'3.1 mi',status:'available'},{id:'d5',name:'Alex M.',initials:'AM',vehicle:'Flatbed Pickup',capacity:900,tags:['lumber','flatbed','hardware'],rating:4.6,reviews:61,dist:'1.8 mi',status:'busy'},{id:'d6',name:'Chris P.',initials:'CP',vehicle:'Cargo Van',capacity:1200,tags:['plumbing','fragile','van'],rating:4.8,reviews:203,dist:'0.5 mi',status:'busy'},{id:'d7',name:'Ryan S.',initials:'RS',vehicle:'1-Ton Flatbed',capacity:1800,tags:['roofing','flatbed','drywall'],rating:4.7,reviews:140,dist:'2.7 mi',status:'available'}];
let selectedJobId=null;
function renderJobs(){const list=document.getElementById('jobs-list');list.innerHTML='';JOBS.forEach((job,i)=>{const card=document.createElement('div');card.className='job-card'+(job.id===selectedJobId?' selected':'');card.style.animationDelay=i*60+'ms';const uc={asap:'badge-asap','2hr':'badge-2hr',same:'badge-same'}[job.urgency];const ul={asap:'ASAP','2hr':'2 hrs',same:'Same day'}[job.urgency];card.innerHTML='<div class="job-top"><div class="job-retailer">'+job.retailer+'</div><span class="job-time-badge '+uc+'">'+ul+'</span></div><div class="job-materials">'+job.materials.map(m=>'<div class="material-tag">'+m.icon+' '+m.name+'</div>').join('')+'</div><div class="job-route"><div class="route-dot green"></div><div class="route-addr">'+job.from+'</div><div class="route-line"></div><div class="route-dot amber"></div><div class="route-addr">'+job.to+'</div></div><div class="job-footer"><span class="job-weight">'+job.weight+'</span><div style="display:flex;align-items:center;gap:10px"><span class="job-payout">'+job.payout+'</span><button class="job-dispatch-btn" onclick="handleDispatch(event,''+job.id+'')">Dispatch</button></div></div>';card.addEventListener('click',()=>selectJob(job.id));list.appendChild(card);});}
function renderDrivers(job=null){const list=document.getElementById('drivers-list');list.innerHTML='';DRIVERS.forEach((driver,i)=>{let compat=null;if(job){const hc=driver.capacity>=job.minCapacity;const hs=job.required.some(r=>driver.tags.includes(r));compat=hc&&hs&&driver.status==='available';}const card=document.createElement('div');card.className='driver-card'+(compat===true?' compatible':compat===false?' incompatible':'');card.style.animationDelay=i*50+'ms';const mt=job?driver.tags.filter(t=>job.required.includes(t)):[];card.innerHTML='<div class="driver-top"><div class="driver-avatar">'+driver.initials+'</div><div class="driver-info"><div class="driver-name">'+driver.name+'</div><div class="driver-vehicle">'+driver.vehicle+'</div></div><span class="driver-status '+(driver.status==='available'?'status-available':'status-busy')+'">'+(driver.status==='available'?'Available':'Busy')+'</span></div><div class="driver-specs"><div class="driver-spec">Capacity <span>'+driver.capacity.toLocaleString()+' lbs</span></div><div class="driver-spec">Reviews <span>'+driver.reviews+'</span></div></div><div class="driver-tags">'+driver.tags.map(t=>'<span class="driver-tag'+(mt.includes(t)?' match':'')+'">'+t+'</span>').join('')+'</div><div class="driver-footer"><div class="driver-rating"><span class="star">★</span>'+driver.rating+'</div><span class="driver-dist">'+driver.dist+'</span><button class="driver-select-btn" onclick="handleSelectDriver(event,''+driver.id+'')">Assign</button></div>';list.appendChild(card);});}
function selectJob(id){selectedJobId=selectedJobId===id?null:id;renderJobs();renderDrivers(selectedJobId?JOBS.find(j=>j.id===selectedJobId):null);}
function handleDispatch(e,id){e.stopPropagation();const job=JOBS.find(j=>j.id===id);const d=DRIVERS.find(d=>d.status==='available'&&d.capacity>=job.minCapacity&&job.required.some(r=>d.tags.includes(r)));showToast(d?d.name+' dispatched for '+job.retailer:'No available drivers match','ETA ~'+(Math.floor(Math.random()*15+10))+' min');}
function handleSelectDriver(e,id){e.stopPropagation();const d=DRIVERS.find(x=>x.id===id);const job=JOBS.find(j=>j.id===selectedJobId);d.status='busy';selectedJobId=null;showToast(d.name+' assigned to '+(job?.retailer??'job'),d.vehicle+' · '+d.dist+' away');renderJobs();renderDrivers();document.getElementById('stat-drivers').textContent=DRIVERS.filter(d=>d.status==='available').length;}
function showToast(t,s){const el=document.getElementById('toast');document.getElementById('toast-text').textContent=t;document.getElementById('toast-sub').textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3800);}
renderJobs();renderDrivers();
</script>
</body>
</html>
